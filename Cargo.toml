[package]
name = "herdr-boxd"
version = "0.1.0"
edition = "2021"
authors = ["Gherman Nicolisin <git@nikolish.in>"]
license = "MIT"

[[bin]]
name = "herdr-boxd"
path = "src/main.rs"

[dependencies]
anyhow = "1"
libc = "0.2"
prost = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = "0.1"
tonic = { version = "0.12", features = ["tls", "tls-roots"] }

[build-dependencies]
tonic-build = "0.12"
