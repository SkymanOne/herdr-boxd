syntax = "proto3";
package boxd.api.v1;

// Subset of the public BoxdApi. Field numbers match
// https://docs.boxd.sh/reference/grpc-proto
service BoxdApi {
  rpc Whoami(WhoamiRequest) returns (WhoamiResponse);
  rpc GetVm(GetVmRequest) returns (GetVmResponse);
  rpc ListVms(ListVmsRequest) returns (ListVmsResponse);
  rpc DestroyVm(DestroyVmRequest) returns (DestroyVmResponse);
  rpc RebootVm(RebootVmRequest) returns (RebootVmResponse);
  rpc ResizeVm(ResizeVmRequest) returns (ResizeVmResponse);
  rpc SuggestVmName(SuggestVmNameRequest) returns (SuggestVmNameResponse);
  rpc CreateVmFromSnapshot(CreateVmFromSnapshotRequest) returns (CreateVmResponse);
  rpc CreateSnapshot(CreateSnapshotRequest) returns (CreateSnapshotResponse);
  rpc GetSnapshot(GetSnapshotRequest) returns (GetSnapshotResponse);
  rpc UploadFileStream(stream UploadFileChunk) returns (UploadFileResponse);
  rpc Exec(stream ExecChunk) returns (stream ExecChunk);
}

message WhoamiRequest {}
message WhoamiResponse {
  string user_id = 1;
}

message GetVmRequest { string vm_id = 1; }
message GetVmResponse {
  string vm_id = 1;
  string name = 2;
  string public_ip = 4;
  string status = 5;
  uint32 ssh_port = 9;
  string access_domain = 12;
  uint32 vcpu = 15;
  uint64 memory_bytes = 16;
}

message ListVmsRequest {
  string org = 1;
  bool all_contexts = 2;
}
message ListVmsResponse {
  repeated GetVmResponse vms = 1;
  string ssh_host_key = 2;
}

message DestroyVmRequest { string vm_id = 1; }
message DestroyVmResponse {}
message RebootVmRequest { string vm_id = 1; }
message RebootVmResponse {}
message ResizeVmRequest {
  string vm_id = 1;
  uint32 vcpu = 2;
  uint64 memory_bytes = 3;
}
message ResizeVmResponse {
  uint32 vcpu = 1;
  uint64 memory_bytes = 2;
  bool rebooted = 3;
}

message SuggestVmNameRequest {}
message SuggestVmNameResponse { string name = 1; }

message CreateVmFromSnapshotRequest {
  string snapshot = 1;
  string name = 2;
}
message CreateVmResponse {
  string vm_id = 1;
  string name = 2;
  string public_ip = 3;
  string url = 4;
  string status = 6;
}

message CreateSnapshotRequest {
  string vm = 1;
  string name = 2;
}
message CreateSnapshotResponse {
  string snapshot_id = 1;
  string name = 2;
  uint64 version = 3;
  string status = 4;
}

message GetSnapshotRequest {
  string name = 1;
  string org = 2;
}
message SnapshotInfo {
  string snapshot_id = 1;
  string name = 2;
  uint64 version = 3;
  string status = 4;
}
message GetSnapshotResponse {
  SnapshotInfo snapshot = 1;
}

message UploadFileChunk {
  string vm_id = 1;
  string path = 2;
  uint64 total_size = 3;
  bytes data = 4;
}
message UploadFileResponse {
  uint64 bytes_written = 1;
}

message ExecChunk {
  bytes data = 1;
  bool stdin = 2;
  bool tty = 3;
  string command = 4;
  string vm_id = 5;
  int32 exit_code = 6;
  uint32 cols = 7;
  uint32 rows = 8;
  bool window_change = 9;
  bool is_stderr = 10;
  string device_id = 11;
}
