id = "boxd.session"
name = "Boxd"
version = "0.2.0"
min_herdr_version = "0.9.1"
description = "Start boxd machines from a snapshot, connect them in Herdr, and run subagents in them"
platforms = ["linux", "macos"]

[[build]]
command = ["sh", "scripts/plugin-build.sh"]
platforms = ["linux", "macos"]

[[actions]]
id = "menu"
title = "Boxd"
contexts = ["global", "workspace", "pane"]
command = ["target/release/herdr-boxd", "open-menu"]

[[actions]]
id = "start"
title = "Start boxd session"
contexts = ["global", "workspace", "pane"]
command = ["target/release/herdr-boxd", "open-menu", "start"]

[[actions]]
id = "configure"
title = "Configure boxd snapshot"
contexts = ["global"]
command = ["target/release/herdr-boxd", "open-menu", "configure"]

[[actions]]
id = "update"
title = "Update boxd snapshot"
contexts = ["global"]
command = ["target/release/herdr-boxd", "open-menu", "update"]

[[actions]]
id = "agents"
title = "Boxd agents"
contexts = ["global", "workspace", "pane"]
command = ["target/release/herdr-boxd", "open-menu", "agents"]

[[actions]]
id = "destroy"
title = "Destroy boxd machine"
contexts = ["global"]
command = ["target/release/herdr-boxd", "open-menu", "destroy"]

[[panes]]
id = "menu"
title = "Boxd"
placement = "popup"
width = "72%"
height = 22
command = ["target/release/herdr-boxd", "menu"]
